name: rads
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Workflow management
  - snakemake>=8.0
  - python>=3.10

  # NCBI tools for downloading genomes
  - entrez-direct          # efetch for accession-based downloads
  - ncbi-datasets-cli      # datasets CLI for taxon-based downloads
  - jq                     # JSON parsing for datasets output
  - unzip                  # Extract downloaded archives

  # Sequence analysis tools
  - diamond=2.1.10         # BLAST searches
  - prodigal=2.6.3         # ORF prediction
  - seqkit=2.9.0           # Sequence manipulation

  # DefenseFinder and dependencies
  - defense-finder         # Defense system detection
  - hmmer>=3.1             # Required by DefenseFinder

  # InterProScan dependency (InterProScan itself must be installed manually)
  - openjdk>=11

  # Dashboard dependencies
  - shiny                  # Web dashboard framework
  - plotly                 # Interactive plots
  - polars                 # Fast dataframes
  - numpy                  # Required by plotly
  - pandas                 # Required for plotly express
  - scipy                  # Required for binomial analysis
